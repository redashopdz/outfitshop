<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTFIT SHOP — Sweats Premium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b30'/%3E%3Cstop offset='1' stop-color='%23ff9f0a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='26' fill='url(%23g)'/%3E%3Ctext x='50' y='74' font-size='66' text-anchor='middle' fill='white' font-family='Georgia,serif' font-style='italic'%3Eo%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --fg:#0f1115; --muted:#6b7280; --border:#ececef;
    --card:#ffffff; --soft:#f6f6f4; --primary:#0f1115;
    --accent1:#ff3b30; --accent2:#ff9f0a;
    --grad:linear-gradient(135deg,#ff3b30,#ff9f0a);
    --glow:0 12px 32px -10px rgba(255,59,48,.55);
    --bg-glass:rgba(255,255,255,.72);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0c0d10; --fg:#f4f4f5; --muted:#9ca3af; --border:#24252a;
           --card:#141519; --soft:#1b1c21; --primary:#f4f4f5;
           --bg-glass:rgba(12,13,16,.72); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--fg);
    -webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;
    background:
      radial-gradient(900px 520px at 92% -6%, rgba(255,59,48,.10), transparent 60%),
      radial-gradient(720px 460px at 4% 12%, rgba(255,159,10,.10), transparent 60%),
      radial-gradient(700px 500px at 80% 60%, rgba(255,59,48,.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  html[lang="ar"] body{font-family:'Cairo','Inter',system-ui,sans-serif}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  .fade-up{opacity:0;transform:translateY(30px);transition:.7s cubic-bezier(.2,.7,.3,1)}
  .fade-up.in{opacity:1;transform:none}

  /* ===== LOGO ===== */
  .logo{display:inline-flex;align-items:center;gap:11px;cursor:pointer}
  .logo .mark{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;
    place-items:center;color:#fff;font-family:'Great Vibes',cursive;font-size:28px;line-height:1;
    box-shadow:var(--glow);position:relative;overflow:hidden;padding-bottom:4px}
  .logo .mark::after{content:"";position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);
    transform:translateX(-130%);transition:.6s}
  .logo:hover .mark::after{transform:translateX(130%)}
  .logo:hover .mark{transform:rotate(-6deg) scale(1.05);transition:.3s}
  .logo .txt{display:flex;flex-direction:column;line-height:.82}
  .logo .txt b{font-family:'Great Vibes',cursive;font-weight:400;font-size:27px;color:var(--fg);letter-spacing:.5px}
  .logo .txt i{font-family:'Great Vibes',cursive;font-style:normal;font-size:15px;align-self:flex-end;
    margin-top:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo.small .mark{width:38px;height:38px;font-size:24px;border-radius:12px}
  .logo.small .txt b{font-size:23px}

  @keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes floaty2{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  @keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(26);opacity:0}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes popIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
  @keyframes slideUp{0%,28%{transform:translateY(0)}33%,61%{transform:translateY(-18px)}66%,94%{transform:translateY(-36px)}100%{transform:translateY(-54px)}}
  @keyframes marquee{to{transform:translateX(-50%)}}
  @keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  @keyframes igspin{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(-8deg) scale(1.06)}}

  .announce{background:var(--fg);color:var(--bg);text-align:center;font-size:12px;
    letter-spacing:.6px;padding:9px 12px;font-weight:600;height:36px;overflow:hidden}
  .announce span{display:block;height:18px;animation:slideUp 9s infinite}

  header{position:sticky;top:0;z-index:40;background:var(--bg-glass);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:78px}
  nav ul{display:flex;gap:32px;list-style:none;font-size:14px;font-weight:600}
  nav ul a{color:var(--muted);transition:.2s;position:relative}
  nav ul a:hover{color:var(--fg)}
  nav ul a::after{content:"";position:absolute;bottom:-6px;left:0;width:0;height:2px;background:var(--grad);border-radius:2px;transition:.3s}
  nav ul a:hover::after{width:100%}
  .nav-right{display:flex;align-items:center;gap:10px}

  .lang{display:flex;gap:5px;border:1px solid var(--border);border-radius:999px;padding:4px;background:var(--card)}
  .lang button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
    transition:.25s;opacity:.5;filter:grayscale(.35);padding:0}
  .lang button svg{width:26px;height:26px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .lang button:hover{opacity:1;filter:none;transform:scale(1.12)}
  .lang button.active{opacity:1;filter:none;background:var(--soft);box-shadow:0 0 0 2px var(--accent1)}

  .icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    border:1px solid var(--border);transition:.25s;position:relative;background:var(--card)}
  .icon-btn:hover{border-color:transparent;box-shadow:0 0 0 1.5px var(--accent1);transform:translateY(-3px) rotate(-4deg)}
  .icon-btn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8}
  .count{position:absolute;top:-5px;right:-5px;background:var(--grad);color:#fff;
    font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
  .burger{display:none}

  .hero{padding:56px 0 40px;display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
  .hero > div:first-child > *{opacity:0;animation:fadeUp .8s cubic-bezier(.2,.7,.3,1) forwards}
  .hero .tag{animation-delay:.05s}.hero h1{animation-delay:.15s}.hero p{animation-delay:.28s}
  .hero-btns{animation-delay:.4s}.hero-stats{animation-delay:.52s}
  .tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;color:var(--fg);border:1px solid var(--border);
    padding:7px 15px;border-radius:999px;margin-bottom:24px;background:var(--card)}
  .tag i{width:7px;height:7px;border-radius:50%;background:var(--grad);display:block;animation:pulse 1.8s infinite}
  .hero h1{font-size:clamp(40px,6.5vw,70px);line-height:.98;letter-spacing:-2.5px;font-weight:900;margin-bottom:22px}
  .hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 200%;animation:gradMove 5s ease infinite}
  .hero p{font-size:16px;color:var(--muted);max-width:460px;margin-bottom:32px}
  .hero-btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{padding:15px 32px;border-radius:999px;font-size:14px;font-weight:700;background:var(--grad);
    background-size:180% 180%;color:#fff;transition:.25s;display:inline-flex;align-items:center;
    justify-content:center;gap:9px;position:relative;overflow:hidden;box-shadow:var(--glow)}
  .btn:hover{transform:translateY(-3px);box-shadow:0 18px 40px -12px rgba(255,59,48,.7)}
  .btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border);box-shadow:none}
  .btn.ghost:hover{border-color:var(--fg);box-shadow:none}
  .btn.wide{width:100%}
  .btn.loading{pointer-events:none;opacity:.9}
  .btn.loading::after{content:"";width:15px;height:15px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-left:6px}
  .ripple{position:absolute;width:8px;height:8px;background:rgba(255,255,255,.55);border-radius:50%;transform:translate(-50%,-50%) scale(0);animation:rip .6s forwards;pointer-events:none}
  .hero-stats{display:flex;gap:40px;margin-top:44px}
  .stat b{font-size:26px;font-weight:900;letter-spacing:-1px;display:block}
  .stat span{font-size:12px;color:var(--muted)}
  .hero-visual{position:relative;display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:560px}
  .hero-visual .ph{border-radius:18px;overflow:hidden;background:var(--soft);border:1px solid var(--border)}
  .hero-visual .ph img{width:100%;height:100%;object-fit:cover;transition:.6s}
  .hero-visual .ph:hover img{transform:scale(1.06)}
  .hero-visual .ph:first-child{grid-row:1/3}
  .hero-visual .ph:nth-child(2){animation:floaty 6s ease-in-out infinite}
  .hero-visual .ph:nth-child(3){animation:floaty2 7s ease-in-out infinite}
  .float-badge{position:absolute;bottom:24px;left:-14px;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:12px 16px;display:flex;gap:10px;align-items:center;
    box-shadow:0 24px 50px -24px rgba(0,0,0,.35);animation:floaty 5s ease-in-out infinite}
  .float-badge .stars{color:#f5a623;font-size:13px;letter-spacing:1px}
  .float-badge b{font-size:13px;display:block}
  .float-badge small{font-size:11px;color:var(--muted)}

  .band{background:var(--grad);color:#fff;overflow:hidden;padding:15px 0;white-space:nowrap;margin:30px 0 0}
  .band-inner{display:inline-flex;animation:marquee 26s linear infinite;font-weight:900;letter-spacing:3px;font-size:15px;text-transform:uppercase}
  .band-inner span{padding:0 24px}

  .section{padding:80px 0}
  .sec-head{text-align:center;margin-bottom:46px}
  .sec-head h2{font-size:clamp(28px,4.5vw,46px);letter-spacing:-1.5px;font-weight:900;position:relative;display:inline-block}
  .sec-head h2::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:60px;height:4px;border-radius:3px;background:var(--grad)}
  .sec-head p{color:var(--muted);font-size:15px;margin-top:22px}

  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .cat{position:relative;border-radius:20px;overflow:hidden;height:290px;cursor:pointer;border:1px solid var(--border)}
  .cat img{width:100%;height:100%;object-fit:cover;transition:.6s}
  .cat:hover img{transform:scale(1.08)}
  .cat-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 62%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px;color:#fff}
  .cat-overlay h3{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .cat-overlay span{font-size:13px;opacity:.85}

  .toolbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:32px;align-items:center}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:10px 20px;border:1px solid var(--border);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.2s;background:var(--card)}
  .chip:hover{border-color:var(--accent1);color:var(--fg)}
  .chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
  .tool-right{display:flex;gap:10px;align-items:center}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:10px 18px;background:var(--card)}
  .search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8}
  .search input{border:none;background:none;color:var(--fg);font-size:13px;outline:none;width:140px}
  select{background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:999px;padding:11px 18px;font-size:13px;outline:none;cursor:pointer;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card);transition:.3s;display:flex;flex-direction:column;position:relative;animation:cardIn .55s both}
  .card::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:.7s;pointer-events:none;z-index:3}
  .card:hover::after{transform:translateX(120%)}
  .card:hover{transform:translateY(-8px);border-color:transparent;box-shadow:0 0 0 1.5px var(--accent1),0 26px 55px -26px rgba(255,59,48,.5)}
  .thumb{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;transition:.6s}
  .card:hover .thumb img{transform:scale(1.07)}
  .badge{position:absolute;top:12px;left:12px;background:var(--fg);color:var(--bg);font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:999px;z-index:2}
  .badge.sale{background:var(--grad);color:#fff;animation:pulse 2.6s infinite}
  .wish{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;z-index:2;transition:.25s}
  .wish svg{width:17px;height:17px;stroke:#111;fill:none;stroke-width:1.8;transition:.2s}
  .wish.active svg{fill:var(--accent1);stroke:var(--accent1)}
  .wish:hover{transform:scale(1.15)}
  .quick{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(255,255,255,.96);color:#111;border-radius:999px;padding:11px;font-size:12px;font-weight:700;opacity:0;transform:translateY(12px);transition:.3s}
  .card:hover .quick{opacity:1;transform:translateY(0)}
  .info{padding:16px;display:flex;flex-direction:column;gap:7px;flex:1}
  .pcat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
  .pname{font-size:14px;font-weight:700;line-height:1.3}
  .prating{font-size:11px;color:var(--muted);display:flex;gap:5px;align-items:center}
  .prating b{color:#f5a623}
  .prow{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
  .price{font-size:15px;font-weight:800}
  .price s{font-size:11px;color:var(--muted);font-weight:500;margin-inline-start:5px}
  .dots{display:flex;gap:5px}
  .dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
  .add{width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--border);border-radius:11px;font-size:13px;font-weight:700;background:transparent;color:var(--fg);transition:.25s}
  .add:hover{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}

  .look{position:relative;border-radius:22px;overflow:hidden;height:420px;margin:20px 0}
  .look img{width:100%;height:100%;object-fit:cover;transition:.8s}
  .look:hover img{transform:scale(1.04)}
  .look-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.75),transparent 65%);display:flex;flex-direction:column;justify-content:center;padding:60px;color:#fff;max-width:640px}
  .look-overlay h2{font-size:clamp(30px,4.5vw,50px);font-weight:900;letter-spacing:-1.5px;margin-bottom:14px}
  .look-overlay p{font-size:15px;opacity:.9;margin-bottom:26px}
  .look-overlay .btn{width:fit-content}

  .tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .test{border:1px solid var(--border);border-radius:18px;padding:26px;background:var(--card);transition:.3s}
  .test:hover{transform:translateY(-6px);border-color:transparent;box-shadow:0 0 0 1.5px var(--accent1),0 20px 45px -24px rgba(255,59,48,.4)}
  .test .stars{color:#f5a623;font-size:14px;margin-bottom:14px;letter-spacing:2px}
  .test p{font-size:14px;color:var(--muted);margin-bottom:18px;line-height:1.6}
  .test .who{display:flex;align-items:center;gap:12px}
  .test .who img{width:42px;height:42px;border-radius:50%;object-fit:cover}
  .test .who b{font-size:13px;display:block}
  .test .who small{font-size:11px;color:var(--muted)}

  /* ===== INSTAGRAM ===== */
  .ig-card{border-radius:24px;overflow:hidden;border:1px solid var(--border);background:var(--card);
    display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .ig-photos{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%;min-height:340px;gap:2px}
  .ig-photos .p{overflow:hidden;background:var(--soft)}
  .ig-photos .p img{width:100%;height:100%;object-fit:cover;transition:.6s}
  .ig-photos .p:hover img{transform:scale(1.1)}
  .ig-info{padding:48px;position:relative}
  .ig-badge{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;
    letter-spacing:1px;text-transform:uppercase;padding:8px 16px;border-radius:999px;color:#fff;
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);margin-bottom:20px}
  .ig-badge svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:1.9;animation:igspin 4s ease-in-out infinite}
  .ig-info h2{font-size:clamp(26px,4vw,38px);font-weight:900;letter-spacing:-1.5px;margin-bottom:12px}
  .ig-info .handle{font-size:17px;font-weight:700;color:var(--muted);margin-bottom:14px;display:block}
  .ig-info p{font-size:14px;color:var(--muted);margin-bottom:26px;line-height:1.7;max-width:360px}
  .ig-follow{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;
    font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
    background-size:180% 180%;transition:.25s;box-shadow:0 12px 32px -12px rgba(253,29,29,.6)}
  .ig-follow:hover{transform:translateY(-3px);background-position:100% 50%;box-shadow:0 18px 40px -12px rgba(253,29,29,.75)}
  .ig-follow svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.9}

  .faq{max-width:760px;margin:0 auto}
  .q{border-bottom:1px solid var(--border)}
  .q-head{display:flex;justify-content:space-between;align-items:center;padding:22px 0;cursor:pointer;font-size:16px;font-weight:600;gap:14px}
  .q-head svg{width:18px;height:18px;stroke:var(--fg);stroke-width:2;fill:none;transition:.3s;flex-shrink:0}
  .q.open .q-head svg{transform:rotate(45deg);stroke:var(--accent1)}
  .q-body{max-height:0;overflow:hidden;transition:.35s;color:var(--muted);font-size:14px;line-height:1.7}
  .q.open .q-body{max-height:240px;padding-bottom:22px}

  .news{border-radius:24px;padding:64px;text-align:center;margin:20px 0 80px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,59,48,.10),rgba(255,159,10,.10));border:1px solid var(--border)}
  .news h2{font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-1.5px;margin-bottom:12px}
  .news p{color:var(--muted);font-size:14px;margin-bottom:28px}
  .news-form{display:flex;gap:10px;max-width:460px;margin:0 auto}
  .news-form input{flex:1;padding:15px 22px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:14px;outline:none}
  .news-form input:focus{border-color:var(--accent1)}

  footer{border-top:1px solid var(--border);padding:60px 0 30px}
  .foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:36px;margin-bottom:46px}
  .foot-brand .logo{margin-bottom:18px}
  .foot-brand p{color:var(--muted);font-size:13px;max-width:290px;margin-bottom:20px}
  .socials{display:flex;gap:10px}
  .socials a{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;transition:.25s}
  .socials a:hover{border-color:transparent;box-shadow:0 0 0 1.5px var(--accent1);transform:translateY(-4px) rotate(-6deg)}
  .socials a.ig:hover{box-shadow:0 0 0 1.5px #fd1d1d}
  .socials svg{width:17px;height:17px;stroke:var(--fg);fill:none;stroke-width:1.7}
  .foot-col h5{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:18px;font-weight:800}
  .foot-col a{display:block;color:var(--muted);font-size:13px;margin-bottom:11px;transition:.2s}
  .foot-col a:hover{color:var(--fg)}
  .foot-bottom{border-top:1px solid var(--border);padding-top:24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.3s;z-index:80;backdrop-filter:blur(4px)}
  .overlay.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100%;width:430px;max-width:92vw;background:var(--card);border-left:1px solid var(--border);z-index:90;transform:translateX(100%);transition:.4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  html[dir="rtl"] .drawer{right:auto;left:0;border-left:none;border-right:1px solid var(--border);transform:translateX(-100%)}
  html[dir="rtl"] .drawer.open{transform:translateX(0)}
  .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:24px;border-bottom:1px solid var(--border)}
  .drawer-head h3{font-size:18px;font-weight:800}
  .drawer-head span{font-size:12px;color:var(--muted);font-weight:500}
  .drawer-body{flex:1;overflow-y:auto;padding:20px 24px}
  .ship-bar{background:var(--soft);border-radius:12px;padding:14px;font-size:12px;margin-bottom:18px;font-weight:600;display:flex;align-items:center;gap:8px}
  .cart-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);animation:cardIn .4s both}
  .cart-item img{width:78px;height:78px;object-fit:cover;border-radius:12px;background:var(--soft)}
  .ci-info{flex:1}
  .ci-info h4{font-size:13px;font-weight:700;margin-bottom:3px}
  .ci-info .meta{font-size:11px;color:var(--muted);margin-bottom:9px}
  .qty{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
  .qty button{width:26px;height:26px;border:1px solid var(--border);border-radius:7px;display:grid;place-items:center;font-size:15px;line-height:1;transition:.2s}
  .qty button:hover{border-color:var(--accent1);transform:scale(1.1)}
  .ci-price{font-size:14px;font-weight:800;white-space:nowrap}
  .remove{font-size:11px;color:var(--muted);text-decoration:underline;margin-top:8px}
  .drawer-foot{padding:24px;border-top:1px solid var(--border)}
  .total-row{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-bottom:18px}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 0}
  .empty svg{width:60px;height:60px;stroke:var(--border);fill:none;stroke-width:1.5;margin:0 auto 16px}

  .modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.3s;overflow-y:auto}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:780px;width:100%;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;transform:scale(.94);transition:.3s;max-height:90vh;position:relative}
  .modal.open .modal-box{transform:scale(1)}
  .modal-box img{width:100%;height:100%;object-fit:cover;background:var(--soft)}
  .modal-info{padding:32px;display:flex;flex-direction:column;overflow-y:auto}
  .modal-info h3{font-size:24px;font-weight:900;letter-spacing:-.8px;margin-bottom:8px}
  .modal-info .price{font-size:22px;margin:14px 0 18px}
  .opt-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:9px;font-weight:700}
  .sizes{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .size{width:46px;height:46px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:700;transition:.2s}
  .size:hover{border-color:var(--accent1);transform:translateY(-2px)}
  .size.active{background:var(--grad);color:#fff;border-color:transparent}
  .colors{display:flex;gap:10px;margin-bottom:24px}
  .swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}
  .swatch.active{outline:2px solid var(--accent1);outline-offset:2px;transform:scale(1.08)}
  .modal-desc{font-size:13px;color:var(--muted);margin-bottom:24px;line-height:1.7}
  .close-x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:grid;place-items:center;z-index:3;font-size:16px;transition:.3s}
  html[dir="rtl"] .close-x{right:auto;left:16px}
  .close-x:hover{transform:rotate(90deg)}

  .ck{background:var(--card);border:1px solid var(--border);border-radius:20px;max-width:600px;width:100%;padding:34px;position:relative;transform:scale(.94);transition:.3s;max-height:90vh;overflow-y:auto}
  .modal.open .ck{transform:scale(1)}
  .ck h3{font-size:22px;font-weight:900;letter-spacing:-.6px;margin-bottom:6px}
  .ck .sub{font-size:13px;color:var(--muted);margin-bottom:22px}
  .steps{display:flex;gap:8px;margin-bottom:28px}
  .step-dot{flex:1;height:4px;border-radius:999px;background:var(--border);transition:.3s}
  .step-dot.on{background:var(--grad)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
  .field input{width:100%;padding:13px 16px;border-radius:11px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg);font-size:14px;outline:none;font-family:inherit;transition:.2s}
  .field input:focus{border-color:var(--accent1);transform:translateY(-1px)}
  .field input.err{border-color:var(--accent1);animation:popIn .3s}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pay-box{display:flex;gap:12px;align-items:center;border:1.5px solid var(--accent1);background:var(--soft);border-radius:12px;padding:16px;margin-bottom:8px}
  .pay-box .ic{width:40px;height:40px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:19px;flex-shrink:0}
  .pay-box b{font-size:14px;display:block}
  .pay-box small{font-size:12px;color:var(--muted)}
  .ck-btns{display:flex;gap:10px;margin-top:22px}
  .ck-btns .btn{flex:1}
  .sum{background:var(--soft);border-radius:14px;padding:18px;margin-bottom:16px;font-size:13px}
  .sum .line{display:flex;justify-content:space-between;padding:6px 0}
  .sum .line.total{border-top:1px solid var(--border);margin-top:8px;padding-top:12px;font-weight:800;font-size:15px}
  .sum h5{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:14px 0 6px}
  .sum h5:first-child{margin-top:0}
  .sum-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;gap:10px}
  .success{text-align:center;padding:14px 0}
  .success .tick{width:76px;height:76px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 20px;font-size:36px;animation:popIn .5s;box-shadow:var(--glow)}
  .success h3{font-size:24px;font-weight:900;margin-bottom:8px}
  .success .ordnum{font-family:ui-monospace,monospace;font-size:14px;background:var(--soft);padding:8px 16px;border-radius:999px;display:inline-block;margin-bottom:20px;font-weight:700}
  .badge-type{display:inline-block;background:var(--grad);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}

  #sent{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);opacity:0;pointer-events:none;transition:.45s;overflow:hidden}
  #sent.show{opacity:1;pointer-events:auto}
  .sent-inner{text-align:center;position:relative;z-index:2}
  .sent-check{width:120px;height:120px;margin:0 auto 26px}
  .sent-check svg{width:120px;height:120px}
  .sent-check circle{stroke:var(--accent1);stroke-width:3;fill:none;stroke-dasharray:320;stroke-dashoffset:320;animation:draw .7s cubic-bezier(.5,0,.3,1) forwards}
  .sent-check path{stroke:var(--accent1);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .6s ease forwards}
  #sent.show .sent-inner{animation:popIn .5s}
  .sent-inner h2{font-size:clamp(28px,5vw,46px);font-weight:900;letter-spacing:-1.5px;margin-bottom:10px}
  .sent-inner h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sent-inner p{color:var(--muted);font-size:15px}
  .confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;z-index:1;animation:fall linear forwards}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(24px);background:var(--fg);color:var(--bg);padding:14px 26px;border-radius:999px;font-size:13px;font-weight:700;z-index:120;opacity:0;pointer-events:none;transition:.3s;display:flex;align-items:center;gap:9px;box-shadow:0 16px 40px -16px rgba(0,0,0,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;stroke:var(--bg);fill:none;stroke-width:2.5}

  @media(max-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} .cats{grid-template-columns:1fr 1fr} }
  @media(max-width:900px){
    .hero{grid-template-columns:1fr;gap:34px;padding:40px 0}
    .hero-visual{height:420px}
    nav ul{display:none}
    .burger{display:grid}
    .tgrid{grid-template-columns:1fr}
    .modal-box{grid-template-columns:1fr}
    .modal-box>img{height:240px}
    .look-overlay{padding:34px}
    .foot-grid{grid-template-columns:1fr 1fr}
    .logo .txt b{font-size:23px}
    .ig-card{grid-template-columns:1fr}
    .ig-info{padding:34px}
    .ig-photos{min-height:260px}
  }
  @media(max-width:640px){
    .grid{grid-template-columns:1fr 1fr}
    .cats{grid-template-columns:1fr}
    .news{padding:38px 22px}
    .news-form{flex-direction:column}
    .foot-grid{grid-template-columns:1fr}
    .row2{grid-template-columns:1fr}
    .hero-stats{gap:24px}
    .logo .txt{display:none}
  }
</style>
</head>

function addToCart(id,size,colorIdx){
  const p = PRODUCTS.find(x=>x.id===id);
  const color = p.colors[colorIdx]?.n || p.colors[0].n;
  const key = id+"-"+size+"-"+color;
  const found = cart.find(i=>i.key===key);
  if(found) found.qty++; else cart.push({key,id,name:p.name,price:p.price,size,color,img:p.img,qty:1});
  save(); renderCart(); toast(p.name+" "+t("toast.added"));
}

  const it = cart.find(i=>i.key===key); if(!it) return;
  it.qty += d; if(it.qty<=0) cart = cart.filter(i=>i.key!==key);
  save(); renderCart();
}
function removeItem(key){ cart = cart.filter(i=>i.key!==key); save(); renderCart(); }

function ckNext(){
  const v = id => $(id)?.value.trim() || "";

async function placeOrder(){
  const btn = $("confirmBtn"); if(btn) btn.classList.add("loading");
  const sub = cart.reduce((s,i)=>s+i.qty*i.price,0);
  const num = "OUTFIT-" + Math.floor(100000 + Math.random()*899999);
  const itemsText = cart.map(i=>`• ${i.qty}× ${i.name} (${i.size} / ${i.color}) — ${money(i.price*i.qty)}`).join("\n");
  const order = {num, sub, total:sub, itemsText, items:cart.map(i=>({...i})), info:{...ck.info}};
  await sendWebhook(order);
  showSent();
  setTimeout(()=>{ hideSent(); renderSuccess(order); }, 3000);
}
async function sendWebhook(o){
  const payload = {
    username: BRAND + " • Boutique",
    avatar_url:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=200&q=60",
    embeds:[{
      title:"🛒 Nouvelle commande — " + BRAND,
      color: 0xff3b30,
      fields:[
        {name:"📦 N° commande", value:"`"+o.num+"`", inline:true},
        {name:"💵 Total", value:"**"+money(o.total)+"**", inline:true},
        {name:"👤 Client", value:o.info.name || "—", inline:false},
        {name:"📞 Téléphone", value:o.info.phone || "—", inline:true},
        {name:"✉️ Email", value:o.info.email || "—", inline:true},
        {name:"📍 Adresse", value:`${o.info.address}, ${o.info.city} ${o.info.zip||""}`, inline:false},
        {name:"💳 Paiement", value:t("ck.cod"), inline:true},
        {name:"🧾 Articles", value:"```"+o.itemsText+"```", inline:false},
        ...(o.info.note?[{name:"📝 Note", value:o.info.note, inline:false}]:[])
      ],

    }]

  try{ await fetch(WEBHOOK, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)}); }

}

  const s = $("sent");
  for(let i=0;i<70;i++){
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random()*100 + "%";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.6 + Math.random()*1.6) + "s";
    c.style.animationDelay = (Math.random()*0.5) + "s";
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    s.appendChild(c); setTimeout(()=>c.remove(), 4000);
  }
}

function subscribe(){

  toast(t("toast.sub")); $("emailInput").value = "";

let toastTimer;
function toast(msg){
  const el = $("toast");
  el.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>${msg}`;
  el.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2400);
}

document.addEventListener("click", e=>{
  const b = e.target.closest(".btn"); if(!b) return;
  const r = document.createElement("span"); r.className="ripple";
  const rect = b.getBoundingClientRect();
  r.style.left = (e.clientX-rect.left)+"px"; r.style.top = (e.clientY-rect.top)+"px";
  b.appendChild(r); setTimeout(()=>r.remove(),600);
});

const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); }),{threshold:.1});
document.querySelectorAll(".section, .look, .news, .test, .ig-card").forEach(el=>{ el.classList.add("fade-up"); io.observe(el); });
document.querySelectorAll("[data-count]").forEach(el=>{
  const target = +el.dataset.count, suf = el.dataset.suffix || "";
  let cur=0; const step = Math.ceil(target/40);
  const t2 = setInterval(()=>{ cur += step; if(cur>=target){cur=target;clearInterval(t2);} el.textContent = cur+suf; }, 35);
});

applyLang();
</script>
</body>
</html>
